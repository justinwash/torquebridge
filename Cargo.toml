[package]
name = "forzabeast"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hidapi = "2.6"
libloading = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = "1.7"
thiserror = "2.0"
winapi = { version = "0.3.9", features = ["dinput", "libloaderapi", "wincon", "winerror", "winuser"] }

[build-dependencies]
slint-build = "1.7"
